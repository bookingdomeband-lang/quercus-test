<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Administration — Le Quercus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--cream:#f7f0e4;--cream-2:#f1e7d6;--forest:#2f3417;--copper:#9c6b34;--copper-2:#b98a45;--ink:#38341f;--muted:#8c8368;--line:rgba(156,107,52,.3);--D:"Cormorant Garamond",serif;--U:"Jost",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--U);background:var(--cream);color:var(--ink);padding-bottom:5rem}
.topbar{position:sticky;top:0;z-index:5;background:var(--forest);color:#f7f0e4;display:flex;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,4vw,2rem)}
.brand{font-family:var(--D);font-size:1.4rem;display:flex;align-items:center;gap:.5rem}
.brand i{width:7px;height:7px;background:var(--copper-2);transform:rotate(45deg)}
.brand small{font-family:var(--U);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--copper-2);margin-left:.4rem}
.wrap{width:min(760px,92vw);margin:2.4rem auto}
h2{font-family:var(--D);font-weight:500;color:var(--forest);font-size:1.9rem;margin-bottom:.3rem}
.hint{font-size:.85rem;color:var(--muted);margin-bottom:1.4rem;line-height:1.5}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.4rem 1.5rem;margin-bottom:1.6rem}
.card>h3{font-family:var(--D);font-weight:500;color:var(--copper);font-size:1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.dmd{width:7px;height:7px;background:var(--copper);transform:rotate(45deg);display:inline-block;flex:none}
label{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:.8rem 0 .3rem}
.soft{text-transform:none;letter-spacing:0;font-size:.85em}
input,textarea{width:100%;font-family:var(--U);font-size:1rem;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:3px;padding:.6rem .7rem}
input:focus,textarea:focus{outline:none;border-color:var(--copper);background:#fff}
textarea{resize:vertical;min-height:52px}
.dish-row{border:1px dashed var(--line);border-radius:4px;padding:.9rem 1rem;margin-bottom:.9rem;background:var(--cream)}
.g2{display:grid;grid-template-columns:1fr 90px;gap:.6rem}
.ra{display:flex;justify-content:flex-end;margin-top:.5rem}
.alg-checks{display:flex;flex-wrap:wrap;gap:5px;margin-top:.5rem}
.alg-ck{display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:3px 8px 3px 4px;border-radius:20px;border:1px solid var(--line);transition:background .15s,border-color .15s;user-select:none}
.alg-ck input[type=checkbox]{width:auto;padding:0;margin:0;accent-color:var(--copper);cursor:pointer;background:none;border:none}
.alg-ck img{width:18px;height:18px;border-radius:50%;flex:none}
.alg-ck span{font-family:var(--U);font-size:.62rem;letter-spacing:.06em;color:var(--muted)}
.alg-ck.checked{background:rgba(156,107,52,.1);border-color:var(--copper)}
.alg-ck.checked span{color:var(--copper)}
.btn{font-family:var(--U);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--copper);color:var(--copper);background:none;padding:.55rem 1rem;border-radius:3px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--copper);color:#fff}
.ghost{border-color:var(--line)!important;color:var(--muted)!important}.ghost:hover{background:var(--muted)!important;color:#fff!important}
.danger{border-color:#b25b4a!important;color:#b25b4a!important;padding:.4rem .7rem!important}.danger:hover{background:#b25b4a!important;color:#fff!important}
.add-line{margin-top:.5rem}
.fr{display:grid;grid-template-columns:1fr 110px auto;gap:.6rem;align-items:center;margin-bottom:.6rem}
.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(247,240,228,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:.9rem clamp(1rem,4vw,2rem);display:flex;align-items:center;justify-content:space-between;gap:1rem}
.msg{font-size:.85rem;line-height:1.4}
.ok{color:#2f5c1a}.err{color:#b25b4a}
.save{background:var(--forest)!important;border-color:var(--forest)!important;color:#f7f0e4!important;font-size:.78rem!important;padding:.7rem 1.6rem!important}
.save:hover{background:#474f2b!important}
.gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.box{width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2.2rem 2rem;text-align:center}
.diamond{width:12px;height:12px;background:var(--copper);transform:rotate(45deg);margin:0 auto 1rem}
.box h1{font-family:var(--D);font-weight:500;color:var(--forest);font-size:1.8rem}
.box p{font-size:.85rem;color:var(--muted);margin:.3rem 0 1.4rem}
.box input{text-align:center;margin-bottom:1rem}
.emsg{color:#b25b4a;font-size:.82rem;min-height:1.2em;margin-top:.6rem;line-height:1.4}
.hidden{display:none!important}
.tabs{display:flex;gap:0;margin-bottom:1.6rem;border-bottom:2px solid var(--line)}
.tab{font-family:var(--U);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
background:none;border:none;padding:.7rem 1.4rem;cursor:pointer;color:var(--muted);
border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s}
.tab:hover{color:var(--copper)}
.tab.active{color:var(--copper);border-bottom-color:var(--copper);font-weight:500}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <div class="diamond"></div>
    <h1>Administration</h1>
    <p>Le Quercus · gestion de la carte</p>
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password"/>
    <button class="btn save" id="loginBtn" style="width:100%">Entrer</button>
    <div class="emsg" id="loginErr"></div>
  </div>
</div>
<div id="app" class="hidden">
  <div class="topbar">
    <span class="brand"><i></i> Le Quercus <small>Admin</small></span>
    <button class="btn ghost" id="logoutBtn" style="color:#f7f0e4;border-color:rgba(247,240,228,.35)">Quitter</button>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="carte">La carte</button>
      <button class="tab" data-tab="news">News &amp; Événements</button>
    </div>
    <div id="tab-carte">
    <div class="card">
      <h3><span class="dmd"></span> Plat du jour</h3>
      <label>Nom <span class="soft">(vide = masqué)</span></label><input id="pj_nom" placeholder="Ex. Blanquette de veau"/>
      <label>Description</label><textarea id="pj_desc" placeholder="Ex. Riz pilaf, légumes glacés."></textarea>
      <label>Prix</label><input id="pj_prix" placeholder="Ex. 16" style="max-width:140px"/>
    </div>
    <div id="sections"></div>

<div class="card">
      <h3><span class="dmd"></span> Menu enfant</h3>
      <label>Prix global</label>
      <input id="me_prix" placeholder="Ex. 15 €" style="max-width:120px"/>
      <label>Entrées <span class="soft">(séparées par ·)</span></label>
      <input id="me_entrees" placeholder="Ex. Soupe du jour · Crudités maison"/>
      <label>Plats <span class="soft">(séparés par ·)</span></label>
      <input id="me_plats_list" placeholder="Ex. Steak haché frites · Nuggets"/>
      <label>Desserts <span class="soft">(séparés par ·)</span></label>
      <input id="me_desserts" placeholder="Ex. Glace · Compote · Yaourt"/>
      <label>Mention incluse</label>
      <input id="me_inclus" placeholder="Ex. Boisson incluse"/>
    </div>
        <div class="card">
      <h3><span class="dmd"></span> Formule du midi</h3>
      <div id="flignes"></div>
      <button class="btn ghost add-line" id="addF">+ Ajouter une ligne</button>
      <label style="margin-top:1rem">Mention</label><input id="fnote" placeholder="Ex. Du lundi au vendredi, le midi"/>
    </div>
  </div>
    </div><!-- /tab-carte -->
    <div id="tab-news" class="hidden">
    <div class="card">
      <h3><span class="dmd"></span> News &amp; Événements</h3>
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:1rem">Ajoutez des événements ponctuels. Un clic sur la carte ouvre une fenêtre avec le détail.</p>
      <div id="newsItems"></div>
      <button class="btn ghost add-line" id="addNews">+ Ajouter un événement</button>
    </div>
  </div>
  <!-- /tab-news -->
  <div class="savebar"><span class="msg" id="msg"></span><button class="btn save" id="saveBtn">Enregistrer</button></div>
</div>

async function verifyPw(pw){
  var r;
  try{r=await fetch('/api/menu',{method:'POST',headers:{'content-type':'application/json','x-admin-key':pw,'x-check':'1'}});}
  catch(e){return{ok:false,msg:'Impossible de joindre le serveur.'};}
  if(r.status===200)return{ok:true};
  if(r.status===401)return{ok:false,msg:'Mot de passe incorrect.'};
  var m='';try{m=(await r.json()).error||'';}catch(e){}
  return{ok:false,msg:m||'Erreur serveur (code '+r.status+').'};
}

gid('loginBtn').addEventListener('click',async function(){
  var pw=gid('pw').value.trim();
  if(!pw){gid('loginErr').textContent='Entrez le mot de passe.';return;}
  gid('loginErr').textContent='Vérification…';
  var res=await verifyPw(pw);
  if(res.ok){PW=pw;sessionStorage.setItem('qpw',pw);await Promise.all([loadMenu(),loadNews()]);showApp();}
  else{gid('loginErr').textContent=res.msg;}
});
gid('pw').addEventListener('keydown',function(e){if(e.key==='Enter')gid('loginBtn').click();});
gid('logoutBtn').addEventListener('click',function(){sessionStorage.removeItem('qpw');location.reload();});

async function loadMenu(){
  try{var r=await fetch('/api/menu',{cache:'no-store'});menu=r.ok?await r.json():JSON.parse(JSON.stringify(DM));}
  catch(e){menu=JSON.parse(JSON.stringify(DM));}
  if(!menu||!menu.sections)menu=JSON.parse(JSON.stringify(DM));
  DM.sections.forEach(function(ds,i){
    if(!menu.sections[i])return;
    var ms=menu.sections[i];
    if(ds.parfums&&!ms.parfums)ms.parfums=JSON.parse(JSON.stringify(ds.parfums));
    if(ds.supplements&&!ms.supplements)ms.supplements=JSON.parse(JSON.stringify(ds.supplements));
    if(ds.parfumsLabel&&!ms.parfumsLabel)ms.parfumsLabel=ds.parfumsLabel;
    if(ds.sauces&&!ms.sauces)ms.sauces=JSON.parse(JSON.stringify(ds.sauces));
    if(ds.accompagnements&&!ms.accompagnements)ms.accompagnements=JSON.parse(JSON.stringify(ds.accompagnements));
  });
  if(menu.menuEnfant){delete menu.menuEnfant.titre;delete menu.menuEnfant.sous;}
  if(!menu.menuEnfant||!menu.menuEnfant.entrees)menu.menuEnfant=JSON.parse(JSON.stringify(DM.menuEnfant));
  fillForm();
}

async function loadNews(){
  try{var r=await fetch('/api/news',{cache:'no-store'});currentNews=r.ok?await r.json():[];}
  catch(e){currentNews=[];}
  renderNewsAdmin();
}

function esc(s){return(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function attr(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function algChecks(selected,onChange){
  var d=document.createElement('div');d.className='alg-checks';
  ALLERGEN_LIST.forEach(function(al){
    var lbl=document.createElement('label');
    lbl.className='alg-ck'+((selected||[]).indexOf(al.key)>=0?' checked':'');
    var chk=document.createElement('input');chk.type='checkbox';chk.value=al.key;
    if((selected||[]).indexOf(al.key)>=0)chk.checked=true;
    chk.addEventListener('change',function(){lbl.className='alg-ck'+(chk.checked?' checked':'');onChange();});
    var img=document.createElement('img');img.src=ALLERGEN_IMGS[al.key]||'';img.alt=al.label;img.width=18;img.height=18;
    var sp=document.createElement('span');sp.textContent=al.label;
    lbl.appendChild(chk);lbl.appendChild(img);lbl.appendChild(sp);d.appendChild(lbl);
  });
  return d;
}

function dishRow(p,onDelete,showPrice){
  showPrice=(showPrice===undefined)?true:showPrice;
  var row=document.createElement('div');row.className='dish-row';
  var g=document.createElement('div');g.className='g2';
  var dn=document.createElement('div');dn.innerHTML='<label>Nom</label><input data-f="nom" value="'+attr(p.nom||'')+'">';
  g.appendChild(dn);
  if(showPrice){var dp=document.createElement('div');dp.innerHTML='<label>Prix</label><input data-f="prix" value="'+attr(p.prix||'')+'">';g.appendChild(dp);}
  row.appendChild(g);
  var dl=document.createElement('label');dl.textContent='Description';row.appendChild(dl);
  var ta=document.createElement('textarea');ta.setAttribute('data-f','desc');ta.value=p.desc||'';row.appendChild(ta);
  var al=document.createElement('label');al.textContent='Allergènes';row.appendChild(al);
  var ac=algChecks(p.allergenes||[],function(){p.allergenes=Array.from(row.querySelectorAll('.alg-checks input:checked')).map(function(c){return c.value;});});
  row.appendChild(ac);
  var ra=document.createElement('div');ra.className='ra';
  var db=document.createElement('button');db.className='btn danger';db.textContent='Supprimer';
  db.addEventListener('click',onDelete);ra.appendChild(db);row.appendChild(ra);
  row.querySelectorAll('[data-f]').forEach(function(inp){inp.addEventListener('input',function(){p[inp.getAttribute('data-f')]=inp.value;});});
  return row;
}

function supRow(l,onDelete){
  var row=document.createElement('div');row.className='fr';
  var il=document.createElement('input');il.value=l.label||'';il.placeholder='Ex. Chantilly';
  var ip=document.createElement('input');ip.value=l.prix||'';ip.placeholder='Ex. 0,50 €';
  var db=document.createElement('button');db.className='btn danger';db.textContent='✕';
  il.addEventListener('input',function(){l.label=il.value;});
  ip.addEventListener('input',function(){l.prix=ip.value;});
  db.addEventListener('click',onDelete);
  row.appendChild(il);row.appendChild(ip);row.appendChild(db);return row;
}

function renderSections(){
  var host=gid('sections');host.innerHTML='';
  (menu.sections||[]).filter(function(s){return s.titre!=='Menu enfant';}).forEach(function(sec,si){
    var card=document.createElement('div');card.className='card';
    var h3=document.createElement('h3');h3.innerHTML='<span class="dmd"></span> '+esc(sec.titre);card.appendChild(h3);
    if(sec.parfums!==undefined){
      var lpfl=document.createElement('label');lpfl.textContent='Titre parfums';card.appendChild(lpfl);
      var ipfl=document.createElement('input');ipfl.value=sec.parfumsLabel||'';ipfl.placeholder='Ex. Nos parfums';
      ipfl.addEventListener('input',function(){menu.sections[si].parfumsLabel=ipfl.value;});card.appendChild(ipfl);
      if(sec.parfums.glaces!==undefined){
        var lg=document.createElement('label');lg.textContent='Glaces (séparées par ·)';card.appendChild(lg);
        var ig=document.createElement('input');ig.value=(sec.parfums.glaces||[]).join(' · ');
        ig.addEventListener('input',function(){menu.sections[si].parfums.glaces=ig.value.split('·').map(function(s){return s.trim();}).filter(Boolean);});card.appendChild(ig);
      }
      if(sec.parfums.sorbets!==undefined){
        var ls=document.createElement('label');ls.textContent='Sorbets (séparés par ·)';card.appendChild(ls);
        var is=document.createElement('input');is.value=(sec.parfums.sorbets||[]).join(' · ');
        is.addEventListener('input',function(){menu.sections[si].parfums.sorbets=is.value.split('·').map(function(s){return s.trim();}).filter(Boolean);});card.appendChild(is);
      }
    }
    if(sec.sauces!==undefined){
      var lsa=document.createElement('label');lsa.textContent='Sauces (séparées par ·)';card.appendChild(lsa);
      var isa=document.createElement('input');isa.value=(sec.sauces.items||[]).join(' · ');
      isa.addEventListener('input',function(){menu.sections[si].sauces.items=isa.value.split('·').map(function(s){return s.trim();}).filter(Boolean);});card.appendChild(isa);
      var lsas=document.createElement('label');lsas.textContent='Mention sauce';card.appendChild(lsas);
      var isas=document.createElement('input');isas.value=sec.sauces.supp||'';
      isas.addEventListener('input',function(){menu.sections[si].sauces.supp=isas.value;});card.appendChild(isas);
    }
    if(sec.accompagnements!==undefined){
      var lac=document.createElement('label');lac.textContent='Accompagnements (séparés par ·)';card.appendChild(lac);
      var iac=document.createElement('input');iac.value=(sec.accompagnements.items||[]).join(' · ');
      iac.addEventListener('input',function(){menu.sections[si].accompagnements.items=iac.value.split('·').map(function(s){return s.trim();}).filter(Boolean);});card.appendChild(iac);
      var lacs=document.createElement('label');lacs.textContent='Mention supplément';card.appendChild(lacs);
      var iacs=document.createElement('input');iacs.value=sec.accompagnements.supp||'';
      iacs.addEventListener('input',function(){menu.sections[si].accompagnements.supp=iacs.value;});card.appendChild(iacs);
      var lacs2=document.createElement('label');lacs2.textContent='Mention assiette seule';card.appendChild(lacs2);
      var iacs2=document.createElement('input');iacs2.value=sec.accompagnements.supp2||'';
      iacs2.addEventListener('input',function(){menu.sections[si].accompagnements.supp2=iacs2.value;});card.appendChild(iacs2);
    }
    var dishes=document.createElement('div');card.appendChild(dishes);
    function renderDishes(){
      dishes.innerHTML='';
      (menu.sections[si].plats||[]).forEach(function(p,pi){
        dishes.appendChild(dishRow(p,function(){menu.sections[si].plats.splice(pi,1);renderDishes();},true));
      });
    }
    renderDishes();
    var ab=document.createElement('button');ab.className='btn ghost add-line';ab.textContent='+ Ajouter un plat';
    ab.addEventListener('click',function(){menu.sections[si].plats.push({nom:'',desc:'',prix:'',allergenes:[]});renderDishes();});card.appendChild(ab);
    if(sec.supplements!==undefined){
      var lsup=document.createElement('label');lsup.textContent='Suppléments';card.appendChild(lsup);
      var supHost=document.createElement('div');card.appendChild(supHost);
      function renderSups(){
        supHost.innerHTML='';
        (menu.sections[si].supplements||[]).forEach(function(l,li){
          supHost.appendChild(supRow(l,function(){menu.sections[si].supplements.splice(li,1);renderSups();}));
        });
      }
      renderSups();
      var asup=document.createElement('button');asup.className='btn ghost add-line';asup.textContent='+ Ajouter un supplément';
      asup.addEventListener('click',function(){if(!menu.sections[si].supplements)menu.sections[si].supplements=[];menu.sections[si].supplements.push({label:'',prix:''});renderSups();});card.appendChild(asup);
    }
    host.appendChild(card);
  });
}

function renderNewsAdmin(){
  var host=gid('newsItems');host.innerHTML='';
  currentNews.forEach(function(n,i){
    var block=document.createElement('div');block.className='dish-row';block.style.marginBottom='1rem';
    block.innerHTML=
      '<div class="g2" style="margin-bottom:.5rem">'
        +'<div><label>Titre</label><input class="ni-titre" value="'+attr(n.titre||'')+'" placeholder="Ex. Fermeture exceptionnelle"/></div>'
        +'<div><label>Date</label><input class="ni-date" type="date" value="'+(n.date||'')+'" /></div>'
      +'</div>'
      +'<label>Résumé (affiché sur la carte)</label>'
      +'<textarea class="ni-extrait" placeholder="Court résumé...">'+esc(n.extrait||'')+'</textarea>'
      +'<label>Détail (affiché dans la fenêtre)</label>'
      +'<textarea class="ni-corps" style="min-height:80px" placeholder="Texte complet...">'+esc(n.corps||'')+'</textarea>'
      +'<label>Photo <span class="soft">(optionnelle)</span></label>'+'<div class="ni-photo-wrap"></div>'+'<input class="ni-photo-url" placeholder="URL de la photo (https://...)" style="margin-bottom:.3rem"/>'+'<label style="margin-top:.3rem">Ou importer depuis votre appareil</label>'+'<input class="ni-photo-file" type="file" accept="image/*" style="margin-bottom:.5rem"/>'+'<div class="ra"><button class="btn danger ni-del">Supprimer</button></div>';
    // Photo upload
    var photoWrap=block.querySelector('.ni-photo-wrap');
    if(n.photo){var prev=document.createElement('img');prev.src=n.photo;prev.style.cssText='width:100%;max-height:120px;object-fit:cover;margin-bottom:.4rem;display:block';photoWrap.appendChild(prev);}
    block.querySelector('.ni-photo-url').value=n.photo||'';
    block.querySelector('.ni-photo-url').addEventListener('input',function(e){currentNews[i].photo=e.target.value;if(e.target.value){if(photoWrap.querySelector('img'))photoWrap.querySelector('img').src=e.target.value;else{var im=document.createElement('img');im.src=e.target.value;im.style.cssText='width:100%;max-height:120px;object-fit:cover;margin-bottom:.4rem;display:block';photoWrap.prepend(im);}}});
    block.querySelector('.ni-photo-file').addEventListener('change',function(e){
      var file=e.target.files[0];if(!file)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        currentNews[i].photo=ev.target.result;
        block.querySelector('.ni-photo-url').value='';
        var im=photoWrap.querySelector('img');
        if(im)im.src=ev.target.result;
        else{im=document.createElement('img');im.src=ev.target.result;im.style.cssText='width:100%;max-height:120px;object-fit:cover;margin-bottom:.4rem;display:block';photoWrap.prepend(im);}
      };
      reader.readAsDataURL(file);
    });
    block.querySelector('.ni-titre').addEventListener('input',function(e){currentNews[i].titre=e.target.value;});
    block.querySelector('.ni-date').addEventListener('input',function(e){currentNews[i].date=e.target.value;});
    block.querySelector('.ni-extrait').addEventListener('input',function(e){currentNews[i].extrait=e.target.value;});
    block.querySelector('.ni-corps').addEventListener('input',function(e){currentNews[i].corps=e.target.value;});
    block.querySelector('.ni-del').addEventListener('click',function(){currentNews.splice(i,1);renderNewsAdmin();});
    host.appendChild(block);
  });
}
gid('addNews').addEventListener('click',function(){currentNews.push({titre:'',date:'',extrait:'',corps:''});renderNewsAdmin();});

    }catch(e){msgEl.className='msg err';msgEl.textContent='News : connexion impossible.';}
  }
  if(r&&r.status===401){msgEl.className='msg err';msgEl.textContent='Mot de passe refusé — reconnectez-vous.';}
});

if(PW){Promise.all([loadMenu(),loadNews()]).then(showApp);}
</script>
